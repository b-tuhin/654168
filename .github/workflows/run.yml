name: run-imu-nav
on:
  workflow_dispatch:
    inputs:
      source:
        description: "euroc or device"
        default: "device"
      test:
        description: "square, slide or none (device only)"
        default: "square"
  push:
    branches: [main]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        run: python run.py --source "${{ github.event.inputs.source || 'device' }}" --test "${{ github.event.inputs.test || 'square' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imu-nav-results
          path: outputs/
